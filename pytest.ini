[pytest]
asyncio_mode = auto
testpaths = tests

# У tests/ нет __init__.py, поэтому в режиме импорта prepend pytest кладёт в
# sys.path сам каталог tests/, а не корень проекта — и `from bot...` в conftest
# падает. Раньше это маскировалось запуском через `python -m pytest`, который
# добавляет cwd. Теперь голый `pytest` работает тоже, что важно для CI.
pythonpath = .
