[project]
name = "lesson-tracker"
description = "Telegram bot for tracking student lesson payments"
requires-python = ">=3.12"
version = "0.1.0"
readme = "README.md"
authors = [
    { name = "Carbon-Based Lifeform", email = "sdrv87@gmail.com" }
]
dependencies = [
    "aiogram>=3.7,<4",
    # нужен aiogram для работы через прокси (TELEGRAM_PROXY), в т.ч. http-прокси;
    # в import-графе не виден — aiogram подхватывает его сам
    "aiohttp-socks>=0.8",
    "aiosqlite>=0.20",
    "alembic>=1.13",
    "dishka>=1.10.1",
    # импортируется лениво внутри экспорта в .xlsx — grep по шапкам файлов его не видит
    "openpyxl>=3.1",
    "sqlalchemy[asyncio]>=2.0,<3",
]

[dependency-groups]
dev = [
    "mypy>=1.14",
    "pre-commit>=4.0",
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "ruff>=0.9",
    "types-openpyxl>=3.1.5.20260807",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Пакет намеренно называется bot, а не lesson_tracker: rc.d на сервере
# запускает `python -m bot`, и переименование в этом PR сломало бы запуск
# ровно в момент выкатки. Переезд имени — отдельная работа, вместе с rc.d.
packages = ["src/bot"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
plugins = ["sqlalchemy.ext.mypy.plugin"]
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
check_untyped_defs = true
