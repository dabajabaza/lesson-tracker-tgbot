[project]
name = "lesson-tracker"
description = "Telegram bot for tracking student lesson payments"
requires-python = ">=3.12"
version = "0.1.0"
readme = "README.md"
authors = [
    { name = "Carbon-Based Lifeform", email = "sdrv87@gmail.com" }
]
dependencies = [
    "aiogram>=3.7,<4",
    # нужен aiogram для работы через прокси (TELEGRAM_PROXY), в т.ч. http-прокси;
    # в import-графе не виден — aiogram подхватывает его сам
    "aiohttp-socks>=0.8",
    "aiosqlite>=0.20",
    "alembic>=1.13",
    "dishka>=1.10.1",
    # импортируется лениво внутри экспорта в .xlsx — grep по шапкам файлов его не видит
    "openpyxl>=3.1",
    "sqlalchemy[asyncio]>=2.0,<3",
]

# Versions pinned to what the FreeBSD ports tree ships, for every package that
# has no pure-python wheel. PyPI publishes no wheels for FreeBSD at all, so
# those are built from source in the production jail — pydantic-core needs Rust
# (1.27 GiB, not installed there) and the rest burn minutes of an old laptop's
# CPU on every deploy. The jail installs them from py312-* ports instead, and
# pip only skips the build when the version matches the port exactly.
#
# Constraints rather than dependencies: they steer resolution without becoming
# requirements, so development on Linux is unaffected.
#
# Checked against the real ports index by scripts/check-freebsd-pins.py in CI.
[tool.uv]
constraint-dependencies = [
    "aiohttp==3.14.1",        # py312-aiohttp
    "greenlet==3.5.3",        # py312-greenlet
    "markupsafe==3.0.3",      # py312-markupsafe
    "openpyxl==3.1.5",        # py312-openpyxl
    "pydantic-core==2.46.4",  # py312-pydantic-core
]

[dependency-groups]
dev = [
    "mypy>=1.14",
    "pre-commit>=4.0",
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "ruff>=0.9",
    "types-openpyxl>=3.1.5.20260807",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lesson_tracker"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# RUF100 — мёртвые noqa: без него директивы на невключённые правила (ANN,
# BLE, S…) выглядят как «правило включено и осознанно заглушено», хотя их
# никто никогда не проверял.
select = ["E", "F", "I", "UP", "B", "SIM", "RUF100"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
check_untyped_defs = true
