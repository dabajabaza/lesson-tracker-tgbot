# Расширяем дефолтный набор gitleaks, а не подменяем его.
[extend]
useDefault = true

# Зачем это правило.
# Штатное telegram-bot-api-token завязано на ключевое слово "telegram" рядом с
# секретом: строка `TELEGRAM_BOT_TOKEN = "..."` ловится, а `BOT_TOKEN = "..."` —
# уже нет. Этот проект держит токен именно в BOT_TOKEN, то есть дефолтные
# правила пропустили бы настоящую утечку. Ловим по самому виду токена:
# 8-10 цифр, двоеточие, 35 символов base64url — форма достаточно характерная,
# чтобы ложные срабатывания были редкостью.
[[rules]]
id = "telegram-bot-token-anywhere"
description = "Telegram bot token (без привязки к ключевому слову)"
regex = '''\b[0-9]{8,10}:[A-Za-z0-9_-]{35}\b'''
tags = ["telegram", "token"]

  # Форма именно [[rules.allowlists]] (массив), а не устаревшая [rules.allowlist]:
  # одиночная в v8 молча игнорируется.
  #
  # Критерии внутри ОДНОГО блока складываются через И, поэтому путь и regex
  # разнесены по разным блокам — иначе исключение срабатывало бы только для
  # файла, который подходит под оба условия сразу.
  [[rules.allowlists]]
  description = "Сам этот конфиг, чтобы правило не ругалось на свои же примеры"
  paths = ['''\.gitleaks\.toml$''']

# Исключения по regexes здесь сознательно нет. Канонический пример токена из
# документации Telegram правило пометит как утечку — это осознанный перекос в
# сторону строгости: настоящий токен и пример отличаются только значением, и
# лучше лишний раз спросить человека, чем пропустить.
