# Репозиторий публичный: утёкший секрет придётся отзывать, спрятать его уже нельзя.
# Состав намеренно узкий — только защитные проверки, без форматтеров: массовое
# переписывание файлов здесь сейчас только замусорило бы диффы переезда из selfhosted/.
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: detect-private-key
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ['--maxkb=500']
      - id: check-yaml
