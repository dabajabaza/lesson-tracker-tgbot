# Репозиторий публичный: утёкший секрет придётся отзывать, спрятать его уже нельзя.
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.0
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: detect-private-key
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ['--maxkb=500']
      - id: check-yaml
      - id: check-toml
      - id: end-of-file-fixer
      - id: trailing-whitespace

  - repo: local
    hooks:
      - id: mypy
        name: mypy
        # Запуск в venv проекта (uv run), а не в изолированном окружении хука:
        # плагину SQLAlchemy для mypy нужны реально установленные пакеты.
        entry: uv run mypy
        language: system
        types: [python]
        pass_filenames: false
        args: [src]
